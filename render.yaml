services:
  - type: web
    name: hospital-booking-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      - key: DATABASE_HOST
        fromDatabase:
          name: hospital-booking-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: hospital-booking-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: hospital-booking-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: hospital-booking-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: hospital-booking-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: hospital-booking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: hospital-booking-db
    plan: free
    databaseName: hospitalbooking
    user: hospitalbooking
