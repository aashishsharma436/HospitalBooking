services:
  - type: web
    name: hospital-booking-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-booking-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: hospital-booking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: hospital-booking-db
    plan: free
    databaseName: hospitalbooking
    user: hospitalbooking
